[package]
name = "kruk_screenshots"
version = "0.8.0"
edition = "2021"

[dependencies]
global-hotkey = "0.10.0"
xcap = { version = "0.9.10", features = ["wgc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
codegen-units = 1